# Patchbay CI. Every third-party action is pinned to a full commit SHA (tag in the comment).
# Permissions are read-only. No caches or artifacts are shared across forks.
name: ci

on:
  push:
    branches: ["**"]
    paths-ignore: ["docs/**", "*.md"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false
  JAVA_VERSION: "21"

jobs:
  policy:
    name: Policy checks (NetGuard, TLS, SDKs, manifest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Policy self-test (every rule must fire on planted violations)
        run: tools/check-policy.sh --self-test
      - name: Policy check
        run: tools/check-policy.sh
      - name: Validate Gradle wrapper checksum
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

  jvm:
    name: Core + simulators + hub (JVM, no Android SDK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with: { distribution: temurin, java-version: "${{ env.JAVA_VERSION }}" }
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: ./gradlew -Ppatchbay.jvmOnly=true :core:jvmTest :simulators:jvmTest :hub:build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: jvm-test-reports
          path: "**/build/reports/tests/"
          retention-days: 14

  screens:
    name: Screenshot tests (light/dark/night × phone/desktop)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with: { distribution: temurin, java-version: "${{ env.JAVA_VERSION }}" }
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      # Goldens are committed (re-recorded 2026-11-12 with the quiet-hours panel and command bar, ADR 0009); a drifting render fails this job.
      - name: Render and compare with docs/design/screens
        run: ./gradlew :ui:desktopTest
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: design-screens
          path: ui/build/screenshots-actual/
          retention-days: 30

  android:
    name: Android APK (debug + unsigned release, R8, lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with: { distribution: temurin, java-version: "${{ env.JAVA_VERSION }}" }
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Build
        run: ./gradlew :app-android:assembleDebug :app-android:assembleRelease :app-android:lintRelease
      - name: Verify APK permissions are exactly the allowlist
        run: |
          set -euo pipefail
          AAPT2="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2"
          APK="$(ls app-android/build/outputs/apk/release/*.apk | head -1)"
          "$AAPT2" dump permissions "$APK" | grep -oE "name='[^']+'" | sed "s/name='//; s/'//" | sort -u > perms.txt
          cat perms.txt
          # The app's own dynamic-receiver permission is generated by AndroidX; everything else must be listed.
          grep -vE '^(android\.permission\.(INTERNET|ACCESS_NETWORK_STATE|CHANGE_WIFI_MULTICAST_STATE|ACCESS_LOCAL_NETWORK|USE_BIOMETRIC|POST_NOTIFICATIONS|FOREGROUND_SERVICE|FOREGROUND_SERVICE_SPECIAL_USE)|dev\.patchbay\.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION)$' perms.txt && { echo "Unexpected permission(s) above"; exit 1; } || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: patchbay-android
          path: |
            app-android/build/outputs/apk/debug/*.apk
            app-android/build/outputs/apk/release/*.apk
            app-android/build/outputs/mapping/release/mapping.txt
            app-android/build/reports/lint-results-release.html
          retention-days: 30

  windows:
    name: Windows MSI
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with: { distribution: temurin, java-version: "${{ env.JAVA_VERSION }}" }
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      # The Compose plugin would download WiX itself without checksum verification. Fetch it here,
      # verify the pinned SHA-256, and point the plugin at it instead.
      - name: Fetch and verify WiX 3.11.2
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\wix311-binaries.zip"
          Invoke-WebRequest -Uri "https://github.com/wixtoolset/wix3/releases/download/wix3112rtm/wix311-binaries.zip" -OutFile $zip
          $h = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($h -ne "2c1888d5d1dba377fc7fa14444cf556963747ff9a0a289a3599cf09da03b9e2e") { throw "WiX checksum mismatch: $h" }
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP\wix"
          "WIX_PATH=$env:RUNNER_TEMP\wix" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Package MSI
        run: ./gradlew "-Pcompose.desktop.application.downloadWix=false" :app-windows:packageMsi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: patchbay-windows-msi
          path: app-windows/build/compose/binaries/main/msi/*.msi
          retention-days: 30
      # No installer: an app folder you unzip and run. portable.txt switches on portable mode (data beside the exe).
      - name: Package portable app
        shell: pwsh
        run: |
          ./gradlew "-Pcompose.desktop.application.downloadWix=false" :app-windows:createDistributable
          $dir = "app-windows/build/compose/binaries/main/app/Patchbay"
          "Portable mode: Patchbay keeps its data in the PatchbayData folder next to Patchbay.exe. Delete this whole folder to remove everything." | Out-File "$dir/portable.txt" -Encoding utf8
          New-Item -ItemType Directory -Force -Path portable-out | Out-Null
          Compress-Archive -Path $dir -DestinationPath "portable-out/Patchbay-portable.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: patchbay-windows-portable
          path: portable-out/Patchbay-portable.zip
          retention-days: 30

  # Plugin resolution from Gradle Central can fail transiently (seen once at 5df65a6); re-run the job before debugging.
  sbom:
    name: CycloneDX SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with: { distribution: temurin, java-version: "${{ env.JAVA_VERSION }}" }
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: ./gradlew cyclonedxBom
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: build/reports/cyclonedx/
          retention-days: 90
