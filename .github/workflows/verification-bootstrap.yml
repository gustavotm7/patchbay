# Manually run: regenerates gradle/verification-metadata.xml on a runner that can reach Google Maven,
# so it covers the Android and Compose graphs too (app-windows pins the Windows Skiko runtime, so
# one Linux run covers the MSI's dependencies). The result is an artifact, never auto-committed:
# review the diff (new components, unexpected groups), then commit it.
name: verification-bootstrap

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Write metadata (sha256)
        run: |
          ./gradlew --write-verification-metadata sha256 \
            :core:jvmTest :simulators:jvmTest :hub:build :ui:desktopTest \
            :app-android:assembleDebug :app-android:assembleRelease :app-android:lintRelease \
            :app-windows:jar :app-windows:createDistributable cyclonedxBom help
          git diff --stat gradle/verification-metadata.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-metadata
          path: gradle/verification-metadata.xml
