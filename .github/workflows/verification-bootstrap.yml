# Regenerates gradle/verification-metadata.xml on a runner that can reach Google Maven, covering the
# Android and Compose graphs (app-windows pins the Windows Skiko runtime, so one Linux run covers the MSI).
#
# Runs on manual dispatch, or on a push to a `ci/verification-bootstrap*` branch. The result is uploaded
# as an artifact AND printed to the log as gzip+base64 between markers (logs of public repos can be read
# without a token). It is never committed automatically: review the diff, then commit.
name: verification-bootstrap

on:
  workflow_dispatch:
  push:
    branches: ["ci/verification-bootstrap*"]

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Resolve everything (no compilation)
        run: ./gradlew --write-verification-metadata sha256 resolveAllDependencies help
      - name: Run the real tasks too (tool configurations resolved inside tasks); failures are reported, not fatal
        run: |
          ./gradlew --continue --write-verification-metadata sha256 \
            :core:jvmTest :simulators:jvmTest :hub:build :ui:desktopTest \
            :app-android:assembleDebug :app-android:assembleRelease :app-android:lintRelease \
            :app-windows:jar :app-windows:createDistributable cyclonedxBom 2>&1 | tee build.log || true
          echo "::group::Build failures (if any)"
          grep -nE "^e: |FAILED|What went wrong" -A3 build.log | head -300 || true
          echo "::endgroup::"
      - name: Print metadata
        run: |
          echo "PB-METADATA-BEGIN"
          gzip -9c gradle/verification-metadata.xml | base64 -w 0
          echo
          echo "PB-METADATA-END"
          sha256sum gradle/verification-metadata.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-metadata
          path: gradle/verification-metadata.xml

  # Renders the design screenshots and prints them (tar.gz+base64) to the log, so they can be reviewed and
  # committed as goldens from environments without an Actions token.
  export-screens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Render
        run: ./gradlew :ui:recordScreens
      - name: Print screens
        run: |
          tar -C docs/design/screens -czf screens.tgz $(cd docs/design/screens && ls *.png)
          ls -la docs/design/screens
          echo "PB-SCREENS-BEGIN"
          base64 -w 0 screens.tgz
          echo
          echo "PB-SCREENS-END"
          sha256sum screens.tgz
