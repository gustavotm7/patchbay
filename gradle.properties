org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=false
kotlin.code.style=official
kotlin.mpp.stability.nowarn=true
# Android: no Jetifier and no implicit R class sharing.
android.useAndroidX=true
android.nonTransitiveRClass=true
# Don't let the build talk to anything except the configured repositories.
org.gradle.welcome=never
# core/simulators wire a jvm+android `jvmShared` source set by hand (ADR 0001); there are no
# intermediate source sets for the default hierarchy template to create.
kotlin.mpp.applyDefaultHierarchyTemplate=false
